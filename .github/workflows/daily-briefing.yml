name: Actions prioritaires CRM (quotidien)

on:
  schedule:
    - cron: "0 9 * * *"  # 9h UTC = 9h à Dakar (UTC+0, pas d'heure d'été). GitHub peut retarder de quelques minutes.
  workflow_dispatch: {}   # lancement manuel (onglet Actions) pour tester

permissions:
  contents: read

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clé du compte de service Google
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Analyser le CRM et écrire l'onglet « Actions prioritaires »
        # Les logs n'affichent que l'URL de l'onglet, jamais le contenu du CRM.
        run: |
          args=(--sheet "$CRM_SHEET_ID" --credentials "$RUNNER_TEMP/sa.json" --write-tab)
          if [ -n "$CRM_OWNER" ]; then args+=(--owner "$CRM_OWNER"); fi
          python -m crm_agent "${args[@]}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRM_SHEET_ID: ${{ secrets.CRM_SHEET_ID }}
          CRM_OWNER: ${{ vars.CRM_OWNER }}
      - name: Supprimer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
